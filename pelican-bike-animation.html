<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9f1ef">
  <title>鹈鹕骑车</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #234a4d;
      background: #d9f1ef;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; }
    button { font: inherit; }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, 0) 36%),
        #d9f1ef;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 26px clamp(22px, 5vw, 64px) 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .brand::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e76d58;
      box-shadow: 0 0 0 5px rgba(231, 109, 88, .13);
    }

    .label {
      margin: 0;
      color: #668589;
      font-size: 11px;
      letter-spacing: 0;
    }

    main {
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 16px 20px 12px;
    }

    .stage {
      position: relative;
      width: min(1120px, 100%);
      aspect-ratio: 1200 / 760;
      overflow: hidden;
      border: 1px solid rgba(72, 127, 129, .25);
      border-radius: 18px;
      background: #bfe7e5;
      box-shadow: 0 22px 60px rgba(44, 93, 95, .16);
    }

    .stage svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: 4px clamp(22px, 5vw, 64px) 26px;
    }

    h1 {
      margin: 0 0 5px;
      color: #234a4d;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(25px, 3vw, 38px);
      font-weight: 600;
      letter-spacing: 0;
    }

    .caption {
      margin: 0;
      color: #668589;
      font-size: 12px;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    .control {
      position: relative;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid #9bc4c3;
      border-radius: 50%;
      color: #234a4d;
      background: rgba(255, 255, 255, .72);
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .control:hover { border-color: #4f8583; background: #fff; transform: translateY(-2px); }
    .control:focus-visible { outline: 3px solid #e76d58; outline-offset: 3px; }
    .control svg { width: 18px; height: 18px; }

    .control::after {
      content: attr(aria-label);
      position: absolute;
      right: 0;
      bottom: calc(100% + 9px);
      padding: 5px 8px;
      border-radius: 4px;
      color: #fff;
      background: #234a4d;
      font-size: 11px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease;
    }

    .control:hover::after, .control:focus-visible::after { opacity: 1; }

    #scene.is-paused *,
    #scene.is-paused *::before,
    #scene.is-paused *::after { animation-play-state: paused !important; }

    .cloud-drift { animation: cloudDrift 26s linear infinite; }
    .cloud-drift.slow { animation-duration: 38s; animation-delay: -13s; }
    .wave-flow { animation: waveFlow 5.6s linear infinite; }
    .road-flow { animation: roadFlow 2.8s linear infinite; }
    .flower-sway { transform-box: fill-box; transform-origin: bottom center; animation: flowerSway 2.2s ease-in-out infinite; }
    .flower-sway.late { animation-delay: -1.1s; }
    .wheel-spin { transform-box: fill-box; transform-origin: center; animation: wheelSpin 1.1s linear infinite; }
    .pedal-spin { transform-box: fill-box; transform-origin: center; animation: wheelSpin 1.1s linear infinite; }
    .rider-bob { transform-box: fill-box; transform-origin: center bottom; animation: riderBob .55s ease-in-out infinite; }
    .leg-front { transform-box: view-box; transform-origin: 594px 405px; animation: legFront 1.1s linear infinite; }
    .leg-back { transform-box: view-box; transform-origin: 606px 405px; animation: legBack 1.1s linear infinite; }
    .wing-flap { transform-box: view-box; transform-origin: 618px 313px; animation: wingFlap 1.8s ease-in-out infinite; }
    .scarf-tail { transform-box: view-box; transform-origin: 626px 273px; animation: scarfWave 1.25s ease-in-out infinite; }
    .scarf-tail.two { animation-delay: -.52s; animation-duration: 1.4s; }
    .gull-float { animation: gullFloat 5.5s ease-in-out infinite; }
    .gull-float.two { animation-delay: -2.7s; }
    .breeze-line { animation: breezePulse 2.4s ease-in-out infinite; }

    @keyframes cloudDrift {
      from { transform: translateX(-80px); }
      to { transform: translateX(1260px); }
    }
    @keyframes waveFlow {
      from { transform: translateX(0); }
      to { transform: translateX(-180px); }
    }
    @keyframes roadFlow {
      from { transform: translateX(0); }
      to { transform: translateX(-260px); }
    }
    @keyframes flowerSway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes wheelSpin { to { transform: rotate(360deg); } }
    @keyframes riderBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes legFront {
      0%, 100% { transform: rotate(26deg); }
      50% { transform: rotate(-34deg); }
    }
    @keyframes legBack {
      0%, 100% { transform: rotate(-38deg); }
      50% { transform: rotate(22deg); }
    }
    @keyframes wingFlap {
      0%, 100% { transform: rotate(3deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes scarfWave {
      0%, 100% { transform: rotate(-5deg) translateX(0); }
      50% { transform: rotate(8deg) translateX(12px); }
    }
    @keyframes gullFloat {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-18px, -8px); }
    }
    @keyframes breezePulse {
      0%, 100% { opacity: .25; transform: translateX(0); }
      50% { opacity: .9; transform: translateX(16px); }
    }

    @media (max-width: 620px) {
      .topbar { padding-top: 21px; }
      .label { font-size: 10px; }
      main { padding: 12px 12px 10px; }
      .stage { border-radius: 12px; }
      .footer { align-items: center; padding-bottom: 20px; }
      .caption { font-size: 10px; }
      .control { width: 40px; height: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #scene * { animation-play-state: paused !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">海边兜风</div>
      <p class="label">A PELICAN ON TWO WHEELS</p>
    </header>

    <main>
      <div class="stage">
        <svg id="scene" viewBox="0 0 1200 760" role="img" aria-labelledby="scene-title scene-desc">
          <title id="scene-title">一只戴头盔的鹈鹕骑着自行车经过海边</title>
          <desc id="scene-desc">鹈鹕踩动踏板，车轮、海浪、云朵和路边花朵一起运动。</desc>
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#bde7e8"/>
              <stop offset="1" stop-color="#eaf6eb"/>
            </linearGradient>
            <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#7fc5c7"/>
              <stop offset="1" stop-color="#54a7b0"/>
            </linearGradient>
            <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
              <feGaussianBlur stdDeviation="8"/>
            </filter>
            <g id="cloud-shape" fill="#fffdf6">
              <path d="M0 28c-10-18 9-35 31-24 4-27 45-31 58-3 22-18 59 1 46 28h34c22 0 30 30 4 36H11C-9 65-13 40 0 28Z"/>
            </g>
            <g id="flower-shape">
              <path d="M0 0C-3-19 1-34 5-48" fill="none" stroke="#4f806c" stroke-width="4" stroke-linecap="round"/>
              <path d="M3-20C-10-30-16-29-22-25M3-28c10-12 17-13 23-9" fill="none" stroke="#4f806c" stroke-width="3" stroke-linecap="round"/>
              <g transform="translate(5 -51)" fill="#fff7e7">
                <ellipse rx="7" ry="13"/><ellipse rx="7" ry="13" transform="rotate(72)"/><ellipse rx="7" ry="13" transform="rotate(144)"/><ellipse rx="7" ry="13" transform="rotate(216)"/><ellipse rx="7" ry="13" transform="rotate(288)"/>
                <circle r="5" fill="#f2b94b"/>
              </g>
            </g>
            <g id="wheel-spokes" fill="none" stroke="#789799" stroke-width="2">
              <path d="M-90 0h180M0-90v180M-64-64l128 128M-64 64 64-64M-83-34l166 68M-34-83l68 166M-83 34l166-68M-34 83 34-83"/>
            </g>
          </defs>

          <rect width="1200" height="760" fill="url(#sky)"/>
          <circle cx="1000" cy="132" r="68" fill="#f5c961"/>
          <g class="cloud-drift" opacity=".96">
            <use href="#cloud-shape" transform="translate(-100 130) scale(.9)"/>
            <use href="#cloud-shape" transform="translate(350 88) scale(.62)"/>
            <use href="#cloud-shape" transform="translate(820 176) scale(.78)"/>
          </g>
          <g class="cloud-drift slow" opacity=".65">
            <use href="#cloud-shape" transform="translate(-360 260) scale(.52)"/>
            <use href="#cloud-shape" transform="translate(610 280) scale(.42)"/>
          </g>

          <g class="gull-float" fill="none" stroke="#4d888d" stroke-width="4" stroke-linecap="round">
            <path d="M190 208q22-22 44 0 22-22 44 0"/>
          </g>
          <g class="gull-float two" fill="none" stroke="#4d888d" stroke-width="3" stroke-linecap="round">
            <path d="M922 286q14-14 28 0 14-14 28 0"/>
          </g>

          <path d="M0 407c157-46 296-24 451 4 170 31 312 8 460-13 121-17 211-13 289 7v164H0Z" fill="#a8d7d4"/>
          <path d="M0 459c151-19 279-14 423 10 173 29 317 3 479-15 130-14 210-9 298 3v160H0Z" fill="url(#sea)"/>
          <g class="wave-flow" fill="none" stroke="#dff5ec" stroke-width="4" stroke-linecap="round" opacity=".74">
            <path d="M-190 502h82m30 0h112m44 0h70m55 0h92m40 0h102m40 0h88m42 0h112m35 0h95M-90 556h101m32 0h128m44 0h86m32 0h109m41 0h96m35 0h125m35 0h90"/>
          </g>
          <path d="M0 614c179-16 332-13 503 12 154 22 313 17 461-2 93-12 170-13 236-1v137H0Z" fill="#b9ce9e"/>
          <path d="M0 668c184-20 327-10 492 9 168 20 305 19 452-4 91-14 174-14 256-3v90H0Z" fill="#dfe5bf"/>
          <path d="M0 729c222-15 380-8 569 5 176 12 367 10 631-2v28H0Z" fill="#f7ecd0"/>
          <g class="road-flow" fill="none" stroke="#fffaf0" stroke-width="5" stroke-linecap="round">
            <path d="M-240 735h94m75 0h120m84 0h92m84 0h130m76 0h108m82 0h116m76 0h126m72 0h110"/>
          </g>
          <g class="flower-sway" transform="translate(180 706)"><use href="#flower-shape"/></g>
          <g class="flower-sway late" transform="translate(1032 708) scale(.78)"><use href="#flower-shape"/></g>
          <g class="flower-sway" transform="translate(1108 707) scale(.56)"><use href="#flower-shape"/></g>

          <ellipse cx="622" cy="680" rx="239" ry="21" fill="#50756f" opacity=".17" filter="url(#softShadow)"/>

          <g id="bike" stroke-linecap="round" stroke-linejoin="round">
            <g class="wheel-spin" transform="translate(470 620)">
              <circle r="94" fill="#e6f3e9" fill-opacity=".45" stroke="#244f53" stroke-width="12"/>
              <circle r="84" fill="none" stroke="#fff8e9" stroke-width="4"/>
              <use href="#wheel-spokes"/>
              <circle r="8" fill="#f2c766" stroke="#244f53" stroke-width="3"/>
            </g>
            <g class="wheel-spin" transform="translate(802 620)">
              <circle r="94" fill="#e6f3e9" fill-opacity=".45" stroke="#244f53" stroke-width="12"/>
              <circle r="84" fill="none" stroke="#fff8e9" stroke-width="4"/>
              <use href="#wheel-spokes"/>
              <circle r="8" fill="#f2c766" stroke="#244f53" stroke-width="3"/>
            </g>
            <path d="M470 620l82-150 77 131-159 19 332-137-173 118M552 470l220 17m0 0 40 133" fill="none" stroke="#244f53" stroke-width="16"/>
            <path d="M470 620l82-150 77 131-159 19 332-137-173 118M552 470l220 17m0 0 40 133" fill="none" stroke="#e76d58" stroke-width="9"/>
            <path d="M553 470l-13-40m232 57-16-78q-2-10 13-10h46q22 0 17 16l-3 10" fill="none" stroke="#244f53" stroke-width="10"/>
            <path d="M764 488h18q14 0 13 13" fill="none" stroke="#cb8d5c" stroke-width="11"/>
            <path d="M512 436q36-7 72 0 14 3 5 12h-78q-15-4 1-12Z" fill="#3e6868" stroke="#244f53" stroke-width="3"/>
            <path d="M609 588 471 611q-18 8-2 20l146-9" fill="none" stroke="#6d8f86" stroke-width="3"/>
            <circle cx="616" cy="620" r="24" fill="#fff0c7" stroke="#244f53" stroke-width="7"/>
            <g class="pedal-spin" transform="translate(616 620)">
              <path d="M0 0 54 16M0 0-46-17" fill="none" stroke="#244f53" stroke-width="7"/>
              <path d="M47 15h22m-75-33h-22" stroke="#244f53" stroke-width="6"/>
            </g>
          </g>

          <g class="rider-bob">
            <g class="leg-back">
              <path d="M607 405 562 509 580 610" fill="none" stroke="#244f53" stroke-width="23"/>
              <path d="M607 405 562 509 580 610" fill="none" stroke="#e1a13b" stroke-width="14"/>
              <path d="M562 605c-18 0-31 10-32 22h54c12-7 2-21-22-22Z" fill="#efb64a" stroke="#244f53" stroke-width="5"/>
            </g>
            <g class="leg-front">
              <path d="M594 405 652 508 666 620" fill="none" stroke="#244f53" stroke-width="23"/>
              <path d="M594 405 652 508 666 620" fill="none" stroke="#efb64a" stroke-width="14"/>
              <path d="M655 615c-16 2-24 11-20 21h54c5-10-7-22-34-21Z" fill="#efb64a" stroke="#244f53" stroke-width="5"/>
            </g>

            <g id="pelican">
              <path d="M590 368c-15-49-4-104 34-131 36-27 87-13 102 27 10 26-5 52-26 67-22 15-38 28-42 61Z" fill="#fffdf6" stroke="#244f53" stroke-width="8"/>
              <path d="M621 293c16-16 38-24 62-21 28 4 47 22 50 47-27 23-67 29-106 13Z" fill="#e4f0df" stroke="#244f53" stroke-width="7"/>
              <g class="wing-flap">
                <path d="M629 312c-33 14-48 44-33 67 22-5 44-22 58-51Z" fill="#f2f7e9" stroke="#244f53" stroke-width="7"/>
                <path d="M613 343c13-8 23-17 34-30" fill="none" stroke="#9cbbae" stroke-width="4"/>
              </g>
              <path d="M692 239c-3-36 18-64 50-65 34-1 55 24 51 55-3 22-19 36-40 39-24 4-47-8-61-29Z" fill="#fffdf6" stroke="#244f53" stroke-width="8"/>
              <path d="M703 224c14-22 48-27 73-8 7-4 14-5 22-2-8 20-30 33-58 33-16 0-29-7-37-23Z" fill="#4e8985" stroke="#244f53" stroke-width="7"/>
              <path d="M753 243c39 7 74 23 103 45-6 23-28 35-55 27-37-11-61-29-77-54Z" fill="#f0b24d" stroke="#244f53" stroke-width="8"/>
              <path d="M801 290c21 5 43 2 56-9" fill="none" stroke="#d48e3d" stroke-width="5"/>
              <circle cx="748" cy="226" r="7" fill="#244f53"/>
              <circle cx="750" cy="223" r="2.5" fill="#fffdf6"/>
              <path d="M708 180c22-13 44-13 65-4" fill="none" stroke="#d96555" stroke-width="9" stroke-linecap="round"/>
              <path d="M704 182c17-18 45-26 71-13" fill="none" stroke="#244f53" stroke-width="6" stroke-linecap="round"/>
              <path d="M664 358c18 5 34 12 48 24" fill="none" stroke="#244f53" stroke-width="6" stroke-linecap="round"/>
            </g>

            <g class="scarf-tail">
              <path d="M629 275c-42 7-66 25-96 48 35 3 68-6 100-26Z" fill="#e76d58" stroke="#244f53" stroke-width="6"/>
            </g>
            <g class="scarf-tail two">
              <path d="M633 282c-35 20-55 42-70 69 31-10 57-26 76-53Z" fill="#f08b62" stroke="#244f53" stroke-width="6"/>
            </g>
          </g>

          <g class="breeze-line" fill="none" stroke="#fffdf6" stroke-width="5" stroke-linecap="round">
            <path d="M860 392h80m22 0h36"/>
            <path d="M878 416h44"/>
          </g>
        </svg>
      </div>
    </main>

    <footer class="footer">
      <div>
        <h1>鹈鹕骑车去看海</h1>
        <p class="caption">风从长嘴边掠过，车轮一路向前。</p>
      </div>
      <div class="controls" aria-label="动画控制">
        <button id="play-toggle" class="control" type="button" aria-label="暂停动画" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg>
        </button>
        <button id="restart" class="control" type="button" aria-label="重新开始">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <script>
    const scene = document.getElementById("scene");
    const playToggle = document.getElementById("play-toggle");
    const restart = document.getElementById("restart");
    const playIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3-1.7l12 7a2 2 0 0 1 0 3.4l-12 7A2 2 0 0 1 5 19Z"/></svg>';
    const pauseIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg>';
    let paused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function updatePlayback() {
      scene.classList.toggle("is-paused", paused);
      playToggle.innerHTML = paused ? playIcon : pauseIcon;
      playToggle.setAttribute("aria-label", paused ? "播放动画" : "暂停动画");
      playToggle.setAttribute("aria-pressed", String(paused));
    }

    function handleToggle() {
      paused = !paused;
      updatePlayback();
    }

    function handleRestart() {
      scene.classList.add("is-paused");
      scene.querySelectorAll("*").forEach((element) => {
        element.style.animation = "none";
      });
      void scene.offsetWidth;
      scene.querySelectorAll("*").forEach((element) => {
        element.style.animation = "";
      });
      paused = false;
      updatePlayback();
    }

    playToggle.addEventListener("click", handleToggle);
    restart.addEventListener("click", handleRestart);
    updatePlayback();
  </script>
</body>
</html>
