<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8f3f4">
  <title>海风骑行 · 鹈鹕的兜风日</title>
  <style>
    @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
    @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); }
    @font-face { font-family: "Songti SC"; src: local("Songti SC"); }
    @font-face { font-family: "STSong"; src: local("STSong"); }
    :root { color-scheme: light; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #294d50; background: #e8f3f4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; }
    button { font: inherit; }
    .page { position: relative; display: grid; grid-template-rows: auto 1fr auto; min-height: 100svh; overflow: hidden; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 30px 42px 0; z-index: 1; }
    .wordmark { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; }
    .wordmark::before { content: ""; display: block; width: 8px; height: 8px; background: #e77762; border-radius: 50%; }
    .edition { font-size: 11px; color: #557174; }
    main { display: grid; place-items: center; width: 100%; min-height: 350px; }
    .viewport { width: 100%; overflow: hidden; }
    #composition { width: 1440px; height: 900px; transform-origin: top left; }
    #scene { display: block; width: 1440px; height: 900px; overflow: hidden; }
    footer { z-index: 1; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding: 0 42px 30px; }
    h1 { margin: 0 0 7px; font-family: "Songti SC", "STSong", Georgia, serif; font-size: 29px; font-weight: 600; letter-spacing: 0; }
    .subtitle { margin: 0; font-size: 11px; color: #557174; }
    .controls { display: flex; align-items: center; gap: 10px; }
    .control { position: relative; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 1px solid #bdd4d1; border-radius: 50%; background: #f9fcf8; color: #294d50; cursor: pointer; transition: background 160ms, border-color 160ms; }
    .control:hover { background: #fff; border-color: #648183; }
    .control:focus-visible { outline: 3px solid #dc755b; outline-offset: 4px; }
    .control svg { width: 18px; height: 18px; }
    .control::after { content: attr(aria-label); position: absolute; bottom: calc(100% + 10px); padding: 5px 8px; background: #294d50; color: #fff; font-size: 11px; white-space: nowrap; border-radius: 4px; opacity: 0; pointer-events: none; }
    .control:hover::after, .control:focus-visible::after { opacity: 1; }
    .outline { stroke: #294d50; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    .no-fill { fill: none; }
    .moving { transform-box: view-box; }
    @media (max-width: 600px) {
      header { padding: 23px 22px 0; }
      .edition { font-size: 10px; }
      main { min-height: 330px; }
      footer { padding: 0 24px 28px; align-items: center; }
      h1 { font-size: 25px; }
      .subtitle { font-size: 10px; }
      .controls { gap: 8px; }
    }
    @media (max-height: 540px) and (min-width: 601px) {
      header { padding-top: 16px; }
      main { min-height: 230px; }
      footer { padding-bottom: 16px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>

  <script>
    "use strict";
    const animations = [];
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const mobileLayout = window.matchMedia("(max-width: 600px)");
    const playButton = document.getElementById("play-toggle");
    let paused = reducedMotion.matches;

    // Lucide icons, ISC license, https://lucide.dev/license.
    const icons = {
      pause: '<rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/>',
      play: '<path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>',
      restart: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'
    };
    function iconMarkup(name) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + icons[name] + '</svg>';
    }
    function addAnimation(id, frames, duration, options = {}) {
      const animation = document.getElementById(id).animate(frames, {
        duration, iterations: Infinity, easing: "linear", fill: "both", ...options
      });
      animation.pause();
      animation.currentTime = 0;
      animations.push(animation);
      return animation;
    }

    addAnimation("rear-spokes", [{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], 1800);
    addAnimation("front-spokes", [{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], 1800);
    addAnimation("crank", [{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], 1800);

    // Solve the two leg joints from each pedal position so feet stay on the pedals.
    function animateLeg(side, phase, hip) {
      const upperFrames = [], lowerFrames = [], footFrames = [];
      for (let step = 0; step <= 120; step++) {
        const angle = step / 120 * Math.PI * 2 + phase;
        const foot = { x: 677 + 39 * Math.cos(angle), y: 620 + 39 * Math.sin(angle) };
        const dx = foot.x - hip.x, dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const projection = (120 ** 2 - 125 ** 2 + distance ** 2) / (2 * distance);
        const height = Math.sqrt(Math.max(0, 120 ** 2 - projection ** 2));
        const knee = {
          x: hip.x + dx / distance * projection + dy / distance * height,
          y: hip.y + dy / distance * projection - dx / distance * height
        };
        const upperAngle = Math.atan2(knee.y - hip.y, knee.x - hip.x) * 180 / Math.PI;
        const lowerAngle = Math.atan2(foot.y - knee.y, foot.x - knee.x) * 180 / Math.PI;
        upperFrames.push({ transform: `translate(${hip.x}px, ${hip.y}px) rotate(${upperAngle}deg)` });
        lowerFrames.push({ transform: `translate(${knee.x}px, ${knee.y}px) rotate(${lowerAngle}deg)` });
        footFrames.push({ transform: `translate(${foot.x}px, ${foot.y}px)` });
      }
      addAnimation(side + "-upper", upperFrames, 1800);
      addAnimation(side + "-lower", lowerFrames, 1800);
      addAnimation(side + "-foot", footFrames, 1800);
    }
    animateLeg("far", Math.PI, { x: 655, y: 440 });
    animateLeg("near", 0, { x: 633, y: 443 });

    addAnimation("rider", [{ transform: "translateY(0px)" }, { transform: "translateY(-3px)" }, { transform: "translateY(0px)" }], 900, { easing: "ease-in-out" });
    addAnimation("clouds", [{ transform: "translateX(0px)" }, { transform: "translateX(-1440px)" }], 180000);
    addAnimation("waves", [{ transform: "translateX(0px)" }, { transform: "translateX(-360px)" }], 20000);
    addAnimation("road", [{ transform: "translateX(0px)" }, { transform: "translateX(-360px)" }], 3200);
    addAnimation("verge", [{ transform: "translateX(0px)" }, { transform: "translateX(-1440px)" }], 12800);
    addAnimation("foreground", [{ transform: "translateX(0px)" }, { transform: "translateX(-1440px)" }], 9800);
    document.getElementById("scarf-tail-back").style.transformOrigin = "753px 329px";
    document.getElementById("scarf-tail-front").style.transformOrigin = "753px 337px";
    addAnimation("scarf-tail-back", [{ transform: "rotate(-4deg)" }, { transform: "rotate(5deg)" }, { transform: "rotate(-4deg)" }], 1300, { easing: "ease-in-out" });
    addAnimation("scarf-tail-front", [{ transform: "rotate(5deg)" }, { transform: "rotate(-6deg)" }, { transform: "rotate(5deg)" }], 1700, { easing: "ease-in-out" });
    addAnimation("gull-one", [{ transform: "translate(0px, 0px)" }, { transform: "translate(-18px, -9px)" }, { transform: "translate(0px, 0px)" }], 7000, { easing: "ease-in-out" });
    addAnimation("gull-two", [{ transform: "translate(0px, 0px)" }, { transform: "translate(-13px, 7px)" }, { transform: "translate(0px, 0px)" }], 6000, { easing: "ease-in-out" });
    addAnimation("breeze", [{ opacity: .3 }, { opacity: .8 }, { opacity: .3 }], 2200, { easing: "ease-in-out" });

    function updatePlayback() {
      animations.forEach(animation => paused ? animation.pause() : animation.play());
      playButton.innerHTML = iconMarkup(paused ? "play" : "pause");
      playButton.setAttribute("aria-label", paused ? "播放动画" : "暂停动画");
      playButton.setAttribute("aria-pressed", String(paused));
    }
    function handleToggle() { paused = !paused; updatePlayback(); }
    function handleRestart() {
      animations.forEach(animation => { animation.currentTime = 0; });
      paused = false;
      updatePlayback();
    }
    function handleResize() {
      const viewport = document.querySelector(".viewport");
      const composition = document.getElementById("composition");
      const scene = document.getElementById("scene");
      const width = viewport.clientWidth;
      const isMobile = mobileLayout.matches;
      const frameWidth = isMobile ? 820 : 1440;
      const frameHeight = isMobile ? 820 : 900;
      scene.setAttribute("viewBox", isMobile ? "340 70 820 820" : "0 0 1440 900");
      scene.style.width = frameWidth + "px";
      scene.style.height = frameHeight + "px";
      composition.style.width = frameWidth + "px";
      composition.style.height = frameHeight + "px";
      const availableHeight = Math.max(250, window.innerHeight - 180);
      const scale = Math.min(width / frameWidth, availableHeight / frameHeight);
      composition.style.transform = `translateX(${(width - frameWidth * scale) / 2}px) scale(${scale})`;
      viewport.style.height = frameHeight * scale + "px";
    }
    function handleMotionPreference(event) { paused = event.matches; updatePlayback(); }
    playButton.addEventListener("click", handleToggle);
    document.getElementById("restart").addEventListener("click", handleRestart);
    document.getElementById("restart").innerHTML = iconMarkup("restart");
    window.addEventListener("resize", handleResize);
    reducedMotion.addEventListener("change", handleMotionPreference);
    handleResize();
    updatePlayback();
  </script>
</body>
</html>
